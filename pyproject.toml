[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swordfish"
version = "0.1.0"
description = "A tiny Panda3D vertical slice for fishing up ancient weapons and testing them in combat."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "panda3d>=1.10,<2",
]

[project.scripts]
swordfish = "swordfish.game:main"

[tool.setuptools.packages.find]
where = ["src"]
